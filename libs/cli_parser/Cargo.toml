[package]
name = "oden_cli_parser"
version = "0.9.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-cost CLI argument parser for the Oden CLI"

[lib]
path = "src/lib.rs"

[dependencies]
oden_bundle_runtime.workspace = true
oden_config = { workspace = true, features = ["workspace"] }
oden_core.workspace = true
oden_lib.workspace = true
oden_npm_installer.workspace = true
oden_permissions.workspace = true
oden_runtime.workspace = true
deno_semver.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
sys_traits = { workspace = true, features = ["real"] }

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true

[[bench]]
name = "parse"
harness = false
