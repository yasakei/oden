[package]
name = "odenrt_desktop"
version = "2.7.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Provides libodenrt shared library for laufey desktop apps"

[lib]
name = "odenrt"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["v8"]
quickjs = ["oden_core/quickjs", "odenrt/quickjs", "v8/quickjs"]
v8 = ["oden_core/v8", "odenrt/v8", "v8/v8"]

[build-dependencies]
oden_runtime.workspace = true
oden_core.workspace = true
v8.workspace = true

[dependencies]
oden_core.workspace = true
deno_error.workspace = true
oden_lib.workspace = true
oden_runtime.workspace = true
oden_snapshots.workspace = true
deno_terminal.workspace = true
odenrt = { path = "../rt", default-features = false }
laufey = "0.7.0"
libsui.workspace = true

log = { workspace = true, features = ["serde"] }
raw-window-handle.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
v8.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
