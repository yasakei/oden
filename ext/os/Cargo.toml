[package]
name = "oden_os"
version = "0.76.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "OS specific APIs for Oden"

[lib]
path = "lib.rs"

[dependencies]
oden_core.workspace = true
deno_error.workspace = true
deno_path_util.workspace = true
oden_permissions.workspace = true
oden_signals.workspace = true
libc.workspace = true
netif.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }
