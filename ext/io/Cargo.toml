[package]
name = "oden_io"
version = "0.169.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "IO primitives for Oden extensions"

[lib]
path = "lib.rs"

[dependencies]
async-trait.workspace = true
oden_core.workspace = true
deno_error.workspace = true
oden_permissions.workspace = true
filetime.workspace = true
log.workspace = true
pin-project.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(windows))'.dependencies]
os_pipe.workspace = true
libc.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user", "socket"] }

[target.'cfg(windows)'.dependencies]
rand.workspace = true
parking_lot.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Console"] }
oden_subprocess_windows.workspace = true
libc.workspace = true
