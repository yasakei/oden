[package]
name = "oden_fetch"
version = "0.283.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Fetch API implementation for Oden"

[lib]
path = "lib.rs"

[dependencies]
async-compression = { workspace = true, features = ["tokio", "brotli", "gzip"] }
base64.workspace = true
bytes.workspace = true
data-url.workspace = true
oden_core.workspace = true
deno_error.workspace = true
oden_fs.workspace = true
oden_io.workspace = true
deno_path_util.workspace = true
oden_permissions.workspace = true
oden_tls.workspace = true
error_reporter.workspace = true
h2.workspace = true
hickory-resolver.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
percent-encoding.workspace = true
rustls-webpki.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-socks.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tower.workspace = true
tower-service.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos"))'.dependencies]
tokio-vsock.workspace = true

[dev-dependencies]
oden_bench_util.workspace = true
oden_web.workspace = true
oden_webidl.workspace = true
fast-socks5.workspace = true
rustls.workspace = true
sys_traits = { workspace = true, features = ["libc", "real", "winapi"] }

[[bench]]
name = "headers_methods"
harness = false

[[bench]]
name = "body"
harness = false
